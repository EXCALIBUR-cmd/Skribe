<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>skribe</title>
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var saved = JSON.parse(window.localStorage.getItem('skribe.preferences') || '{}') || {};
          var appearance = saved.appearance === 'light' || saved.appearance === 'dark' ? saved.appearance : 'system';
          var dark = appearance === 'dark' || (appearance === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.setAttribute('data-reduce-motion', saved.reduceMotion === true ? 'true' : 'false');
          if (saved.language === 'hi') root.setAttribute('lang', 'hi');
        } catch (error) {
          root.setAttribute('data-theme', window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
