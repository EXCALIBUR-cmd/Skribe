<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#22d3ee"/>
  </marker>
</defs>
<rect width="1200" height="700" rx="30" fill="url(#bg)"/>
<text x="60" y="68" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800">Mess Cleanup</text>
<text x="60" y="100" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">Not “rearrange everything.” Find one useful thing and improve it.</text>

<g font-family="Inter,Arial,sans-serif">
  <!-- stages -->
  <g transform="translate(60,150)">
    <rect x="0" y="0" width="240" height="430" rx="20" fill="#111827" stroke="#334155"/>
    <text x="25" y="42" fill="#a78bfa" font-size="12" font-weight="700">01</text>
    <text x="25" y="76" fill="#f8fafc" font-size="21" font-weight="800">Observe</text>
    <text x="25" y="112" fill="#cbd5e1" font-size="13">Discover visual structures</text>
    <rect x="25" y="160" width="190" height="200" rx="14" fill="#0b1220" stroke="#263244"/>
    <rect x="50" y="205" width="65" height="42" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <rect x="145" y="290" width="65" height="42" rx="8" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M115 226 C140 226, 145 311, 145 311" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="7 7"/>
    <text x="25" y="400" fill="#64748b" font-size="11">flow · sequence · cluster · annotation</text>
  </g>

  <g transform="translate(330,150)">
    <rect x="0" y="0" width="240" height="430" rx="20" fill="#111827" stroke="#334155"/>
    <text x="25" y="42" fill="#22d3ee" font-size="12" font-weight="700">02</text>
    <text x="25" y="76" fill="#f8fafc" font-size="21" font-weight="800">Reason</text>
    <text x="25" y="112" fill="#cbd5e1" font-size="13">Compare current vs candidate</text>
    <rect x="25" y="160" width="190" height="80" rx="14" fill="#0b1220" stroke="#263244"/>
    <text x="40" y="188" fill="#94a3b8" font-size="11">CURRENT QUALITY</text>
    <text x="190" y="216" text-anchor="end" fill="#f8fafc" font-size="25" font-weight="800">7.3</text>
    <rect x="25" y="260" width="190" height="80" rx="14" fill="#0b1220" stroke="#263244"/>
    <text x="40" y="288" fill="#94a3b8" font-size="11">CANDIDATE QUALITY</text>
    <text x="190" y="316" text-anchor="end" fill="#f8fafc" font-size="25" font-weight="800">9.7</text>
    <text x="25" y="390" fill="#22d3ee" font-size="16" font-weight="800">+2.4 benefit</text>
  </g>

  <g transform="translate(600,150)">
    <rect x="0" y="0" width="240" height="430" rx="20" fill="#111827" stroke="#334155"/>
    <text x="25" y="42" fill="#4ade80" font-size="12" font-weight="700">03</text>
    <text x="25" y="76" fill="#f8fafc" font-size="21" font-weight="800">Propose</text>
    <text x="25" y="112" fill="#cbd5e1" font-size="13">Generate a bounded local move</text>
    <rect x="25" y="160" width="190" height="180" rx="14" fill="#0b1220" stroke="#263244"/>
    <rect x="45" y="225" width="58" height="42" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <rect x="150" y="225" width="58" height="42" rx="8" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M103 246 H150" stroke="url(#accent)" stroke-width="4"/>
    <path d="M145 238 l10 8 l-10 8" stroke="#22d3ee" stroke-width="3" fill="none"/>
    <text x="25" y="380" fill="#64748b" font-size="11">movement budget · risk · conflicts</text>
  </g>

  <g transform="translate(870,150)">
    <rect x="0" y="0" width="270" height="430" rx="20" fill="#111827" stroke="#334155"/>
    <text x="25" y="42" fill="#fb7185" font-size="12" font-weight="700">04</text>
    <text x="25" y="76" fill="#f8fafc" font-size="21" font-weight="800">Protect</text>
    <text x="25" y="112" fill="#cbd5e1" font-size="13">Only apply meaningful changes</text>
    <g transform="translate(25,155)">
      <rect x="0" y="0" width="220" height="52" rx="12" fill="#0b1220" stroke="#263244"/>
      <text x="16" y="31" fill="#86efac" font-size="14">✓ verified connectors</text>
      <rect x="0" y="68" width="220" height="52" rx="12" fill="#0b1220" stroke="#263244"/>
      <text x="16" y="99" fill="#86efac" font-size="14">✓ unrelated objects</text>
      <rect x="0" y="136" width="220" height="52" rx="12" fill="#0b1220" stroke="#263244"/>
      <text x="16" y="167" fill="#86efac" font-size="14">✓ creative strokes</text>
      <rect x="0" y="204" width="220" height="52" rx="12" fill="#0b1220" stroke="#263244"/>
      <text x="16" y="235" fill="#86efac" font-size="14">✓ structural dividers</text>
    </g>
    <text x="25" y="380" fill="#f8fafc" font-size="16" font-weight="800">Preview first.</text>
    <text x="25" y="406" fill="#94a3b8" font-size="12">Human approval before apply.</text>
  </g>
</g>

<path d="M300 365 H330" stroke="#22d3ee" stroke-width="4" marker-end="url(#a)"/>
<path d="M570 365 H600" stroke="#22d3ee" stroke-width="4" marker-end="url(#a)"/>
<path d="M840 365 H870" stroke="#22d3ee" stroke-width="4" marker-end="url(#a)"/>
</svg>