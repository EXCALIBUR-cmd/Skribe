<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="0.55" stop-color="#131a33"/>
    <stop offset="1" stop-color="#0b1020"/>
  </linearGradient>
  <linearGradient id="glow1" x1="0" x2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="520" rx="32" fill="url(#bg)"/>
<circle cx="210" cy="110" r="90" fill="#7c3aed" opacity=".18" filter="url(#blur)"/>
<circle cx="980" cy="390" r="120" fill="#22d3ee" opacity=".15" filter="url(#blur)"/>
<g opacity=".28" stroke="#94a3b8">
  <path d="M0 90H1200M0 170H1200M0 250H1200M0 330H1200M0 410H1200"/>
  <path d="M120 0V520M300 0V520M480 0V520M660 0V520M840 0V520M1020 0V520"/>
</g>

<g filter="url(#shadow)">
  <rect x="70" y="80" width="1060" height="360" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
</g>

<!-- title -->
<text x="105" y="135" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800">✦ SKRIBE</text>
<text x="105" y="171" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="17">A collaborative canvas for ideas, teams, and controlled chaos.</text>

<!-- mini board -->
<g transform="translate(105,215)">
  <rect x="0" y="0" width="990" height="180" rx="18" fill="#111827" stroke="#475569"/>
  <text x="25" y="28" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">LIVE BOARD</text>

  <rect x="70" y="65" width="175" height="70" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
  <text x="157" y="96" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">PROJECT</text>
  <text x="157" y="118" text-anchor="middle" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="11">Idea / canvas node</text>

  <path d="M245 100 C295 100, 315 75, 365 75" fill="none" stroke="url(#glow1)" stroke-width="6" stroke-linecap="round"/>
  <path d="M365 75 l-14 -8 l3 16 z" fill="#22d3ee"/>

  <polygon points="430,42 520,95 430,148 340,95" fill="#2e1065" stroke="#c084fc" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="430" y="99" text-anchor="middle" fill="#f5d0fe" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">DECISION</text>

  <path d="M520 95 H650" stroke="#94a3b8" stroke-width="4"/>
  <path d="M650 95 l-14 -8 l3 16 z" fill="#94a3b8"/>

  <rect x="675" y="65" width="175" height="70" rx="14" fill="#052e2b" stroke="#2dd4bf" stroke-width="3"/>
  <text x="762" y="96" text-anchor="middle" fill="#ccfbf1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">SHIP IT</text>
  <text x="762" y="118" text-anchor="middle" fill="#99f6e4" font-family="Inter,Arial,sans-serif" font-size="11">Clean flow</text>

  <path d="M878 38 C935 38, 935 152, 878 152" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 9"/>
  <circle cx="905" cy="95" r="16" fill="#7c3aed" opacity=".25"/>
  <circle cx="905" cy="95" r="7" fill="#a78bfa"/>
</g>

<text x="105" y="470" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">
  Real-time collaboration  ·  Infinite canvas  ·  Structure-aware Mess Cleanup
</text>
