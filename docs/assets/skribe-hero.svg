<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Skribe, a real-time collaborative whiteboard</title>
  <desc id="hero-desc">The Skribe wordmark is written onto a dotted whiteboard. Four sticky notes land in a scattered pile while two collaborators, Maya and Leo, move their cursors. Leo clicks Clean up and the notes snap into a tidy, connected row.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#d4dae7"/>
    </pattern>
    <filter id="lift" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.14"/>
    </filter>
    <clipPath id="write-clip">
      <rect class="write" x="60" y="100" width="560" height="170"/>
    </clipPath>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: ui-rounded, 'SF Pro Rounded', 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .word { font-size: 132px; font-weight: 800; fill: #1e293b; letter-spacing: -3px; }
    .tag { font-size: 23px; font-weight: 650; fill: #1e293b; }
    .sub { font-size: 17px; fill: #64748b; }
    .chip-text { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .note-text { font-size: 16px; font-weight: 750; fill: #1e293b; }
    .tagname { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .presence { font-size: 14px; font-weight: 600; fill: #64748b; }
    .write { transform-box: fill-box; transform-origin: 0% 50%; animation: write 1.2s cubic-bezier(.65,0,.25,1) .2s both; }
    .underline { stroke-dasharray: 560; animation: draw .8s ease-out 1.25s both; }
    .fade-1 { animation: fade .6s ease-out 1.6s both; }
    .fade-2 { animation: fade .6s ease-out 1.8s both; }
    .fade-3 { animation: fade .6s ease-out 2.0s both; }
    .note { transform-box: fill-box; transform-origin: 50% 50%; }
    .n1 { animation: mess-1 .75s cubic-bezier(.3,1.35,.45,1) 4.55s both; }
    .n2 { animation: mess-2 .75s cubic-bezier(.3,1.35,.45,1) 4.6s both; }
    .n3 { animation: mess-3 .75s cubic-bezier(.3,1.35,.45,1) 4.65s both; }
    .n4 { animation: mess-4 .75s cubic-bezier(.3,1.35,.45,1) 4.7s both; }
    .pop { transform-box: fill-box; transform-origin: 50% 50%; }
    .p1 { animation: land .5s cubic-bezier(.3,1.5,.5,1) .5s both; }
    .p2 { animation: land .5s cubic-bezier(.3,1.5,.5,1) .7s both; }
    .p3 { animation: land .5s cubic-bezier(.3,1.5,.5,1) .9s both; }
    .p4 { animation: land .5s cubic-bezier(.3,1.5,.5,1) 1.1s both; }
    .links { animation: fade .6s ease-out 5.45s both; }
    .button { transform-box: fill-box; transform-origin: 50% 50%; animation: press .35s ease-in-out 4.3s both; }
    .maya { transform: translate(812px, 444px); animation: maya 5.8s cubic-bezier(.45,0,.25,1) 1.4s both; }
    .leo { transform: translate(1118px, 238px); animation: leo 5.6s cubic-bezier(.45,0,.25,1) 1.6s both; }
    .live { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes write { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes draw { from { stroke-dashoffset: 560; } to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes land { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: scale(1); } }
    @keyframes mess-1 { from { transform: translate(14px, -150px) rotate(-7deg); } to { transform: none; } }
    @keyframes mess-2 { from { transform: translate(-40px, 52px) rotate(6deg); } to { transform: none; } }
    @keyframes mess-3 { from { transform: translate(30px, -124px) rotate(-4deg); } to { transform: none; } }
    @keyframes mess-4 { from { transform: translate(-34px, 44px) rotate(9deg); } to { transform: none; } }
    @keyframes press { 0% { transform: scale(1); } 45% { transform: scale(.9); } 100% { transform: scale(1); } }
    @keyframes maya {
      0% { transform: translate(1190px, 520px); opacity: 0; }
      8% { opacity: 1; }
      30% { transform: translate(700px, 250px); }
      52% { transform: translate(760px, 214px); }
      70% { transform: translate(890px, 430px); }
      100% { transform: translate(812px, 444px); opacity: 1; }
    }
    @keyframes leo {
      0% { transform: translate(1190px, 30px); opacity: 0; }
      8% { opacity: 1; }
      28% { transform: translate(1000px, 250px); }
      50% { transform: translate(1046px, 104px); }
      58% { transform: translate(1046px, 104px); }
      100% { transform: translate(1118px, 238px); opacity: 1; }
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="520" rx="28" fill="#f8f9ff"/>
  <rect width="1200" height="520" rx="28" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#d4dae7" stroke-width="2"/>

  <g class="ui">
    <circle class="live" cx="84" cy="70" r="6" fill="#16a34a"/>
    <text x="98" y="75" class="presence">2 people on this board</text>

    <g clip-path="url(#write-clip)">
      <text x="68" y="236" class="word">Skribe</text>
    </g>
    <path class="underline" d="M76 262 C 160 248, 250 274, 340 258 S 480 248, 540 262" fill="none" stroke="#ae2f34" stroke-width="8" stroke-linecap="round"/>

    <text x="74" y="318" class="tag fade-1">A whiteboard for thinking out loud, together.</text>
    <text x="74" y="350" class="sub fade-2">Draw live with your team, then tidy up with Mess Cleanup.</text>

    <g class="fade-3">
      <rect x="74" y="378" width="180" height="36" rx="18" fill="#ffffff" stroke="#d4dae7" stroke-width="1.5"/>
      <circle cx="96" cy="396" r="5" fill="#7c3aed"/>
      <text x="110" y="401" class="chip-text">Live collaboration</text>
      <rect x="266" y="378" width="160" height="36" rx="18" fill="#ffffff" stroke="#d4dae7" stroke-width="1.5"/>
      <circle cx="288" cy="396" r="5" fill="#ae2f34"/>
      <text x="302" y="401" class="chip-text">Voice commands</text>
      <rect x="438" y="378" width="146" height="36" rx="18" fill="#ffffff" stroke="#d4dae7" stroke-width="1.5"/>
      <circle cx="460" cy="396" r="5" fill="#16a34a"/>
      <text x="474" y="401" class="chip-text">Mess Cleanup</text>
    </g>

    <g transform="translate(976 78)">
      <g class="button">
        <rect width="150" height="42" rx="21" fill="#ae2f34"/>
        <path d="M30 13 L33 19 L39 22 L33 25 L30 31 L27 25 L21 22 L27 19 Z" fill="#ffdad8"/>
        <text x="48" y="27" class="chip-text" style="fill:#ffffff">Clean up</text>
      </g>
    </g>

    <g class="links">
      <line x1="751" y1="349" x2="778" y2="349" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)"/>
      <line x1="887" y1="349" x2="914" y2="349" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)"/>
      <line x1="1023" y1="349" x2="1050" y2="349" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    </g>

    <g transform="translate(648 300)">
      <g class="note n1"><g class="pop p1" filter="url(#lift)">
        <rect width="98" height="98" rx="10" fill="#e0f2fe"/>
        <path d="M12 46 H86 M12 64 H86 M12 82 H86" stroke="#1e293b" stroke-opacity=".08" stroke-width="1.5"/>
        <text x="13" y="29" class="note-text">Research</text>
      </g></g>
    </g>
    <g transform="translate(784 300)">
      <g class="note n2"><g class="pop p2" filter="url(#lift)">
        <rect width="98" height="98" rx="10" fill="#fff3a0"/>
        <path d="M12 46 H86 M12 64 H86 M12 82 H86" stroke="#1e293b" stroke-opacity=".08" stroke-width="1.5"/>
        <text x="13" y="29" class="note-text">Ideas</text>
      </g></g>
    </g>
    <g transform="translate(920 300)">
      <g class="note n3"><g class="pop p3" filter="url(#lift)">
        <rect width="98" height="98" rx="10" fill="#fce7f3"/>
        <path d="M12 46 H86 M12 64 H86 M12 82 H86" stroke="#1e293b" stroke-opacity=".08" stroke-width="1.5"/>
        <text x="13" y="29" class="note-text">Sketch</text>
      </g></g>
    </g>
    <g transform="translate(1056 300)">
      <g class="note n4"><g class="pop p4" filter="url(#lift)">
        <rect width="98" height="98" rx="10" fill="#dcfce7"/>
        <path d="M12 46 H86 M12 64 H86 M12 82 H86" stroke="#1e293b" stroke-opacity=".08" stroke-width="1.5"/>
        <text x="13" y="29" class="note-text">Ship</text>
      </g></g>
    </g>

    <g class="maya">
      <path d="M0 0 L0 22 L6 16.5 L10.5 26 L14.5 24.2 L10 14.8 L17.5 14.8 Z" fill="#7c3aed" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="16" y="22" width="52" height="22" rx="11" fill="#7c3aed"/>
      <text x="27" y="37" class="tagname">Maya</text>
    </g>
    <g class="leo">
      <path d="M0 0 L0 22 L6 16.5 L10.5 26 L14.5 24.2 L10 14.8 L17.5 14.8 Z" fill="#0e7490" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="16" y="22" width="40" height="22" rx="11" fill="#0e7490"/>
      <text x="26" y="37" class="tagname">Leo</text>
    </g>
  </g>
</svg>
